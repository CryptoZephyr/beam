<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Files</title><style>body{font:18px system-ui,sans-serif;margin:24px}button{font-size:18px;padding:8px 14px}</style></head><body>
<h1>Files</h1>
<p>Selected files are shown in the bar below.</p>
<button id="clear">Clear selection</button>
<div id="bar" style="background:#1e6fd9;color:#fff;padding:12px 16px;margin-top:16px;max-width:320px">3 items selected</div>
<script>
  document.getElementById('clear').addEventListener('click', () => { document.getElementById('bar').style.display = 'none'; });
</script></body></html>
