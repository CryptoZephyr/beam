policy: kane-strict
gates:
  - { id: no-failed-tests, metric: totals.failed, equals: 0, severity: blocking }
  - { id: no-broken-tests, metric: totals.broken, equals: 0, severity: blocking }
  - { id: no-failed-steps, metric: steps.failed, equals: 0, severity: blocking }
  - { id: every-test-checks, metric: metrics.tests_without_checks, equals: 0, severity: blocking }
  - { id: no-heals, metric: metrics.heal.healed_tests, max: 0, severity: blocking }
  - { id: no-failure-records, metric: failures.count, equals: 0, severity: blocking }
