<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Coffee: checkout</title>
<script src="http://127.0.0.1:4330/beam-probe.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <h1>Your order</h1>
  <ul class="items">
    <li><span>Ethiopia Guji, 250 g</span><span>$30.00</span></li>
    <li><span>Colombia Huila, 250 g</span><span>$20.00</span></li>
  </ul>
  <form id="discount">
    <label for="code">Discount code</label>
    <div class="row"><input id="code" name="code" autocomplete="off"><button type="submit">Apply</button></div>
    <p id="discount-msg" role="status"></p>
  </form>
  <dl class="totals">
    <div><dt>Subtotal</dt><dd id="subtotal">$50.00</dd></div>
    <div><dt>Discount</dt><dd id="discount-line">$0.00</dd></div>
    <div class="total"><dt>Total</dt><dd id="total">$50.00</dd></div>
  </dl>
  <button id="place" class="primary">Place order</button>
  <p id="result" role="status"></p>
</main>
<script src="/app.js"></script>
</body>
</html>
